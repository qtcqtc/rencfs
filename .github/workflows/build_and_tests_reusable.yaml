name: '_build-and-tests'
on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0 # TODO: remove this when we cache the builds

jobs:
  tests:
    name: build and tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
      fail-fast: true
    steps:
      - uses: actions/checkout@v4

      - name: setup Rust
        run: |
          rustup toolchain install nightly --component rust-docs
          rustup default nightly
          rustup component add rustc          # Rust compiler
          rustup component add cargo          # Rust package manager
          rustup component add clippy         # Linting tool
          rustup component add rustfmt        # Code formatter
          rustup component add rust-docs      # Documentation
          rustup component add rust-analysis  # Rust analysis for tools
          rustup update
          rustup show

      - name: setup Rust
        run: |
          cargo install cargo-aur
          cargo install cargo-generate-rpm          

      - name: install WinFSP
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp-2.1.25156.msi'
          Invoke-WebRequest `
            -Uri 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi' `
            -OutFile $msi
          $expected = '073A70E00F77423E34BED98B86E600DEF93393BA5822204FAC57A29324DB9F7A'
          $actual = (Get-FileHash -Algorithm SHA256 $msi).Hash
          if ($actual -ne $expected) {
            throw "WinFSP MSI checksum mismatch: $actual"
          }
          $installer = Start-Process msiexec.exe `
            -ArgumentList @('/i', $msi, '/qn', '/norestart') `
            -Wait -PassThru -WindowStyle Hidden
          if ($installer.ExitCode -notin @(0, 3010)) {
            throw "WinFSP installation failed with exit code $($installer.ExitCode)"
          }

      - name: build
        run: |
          cargo build --all-targets --all-features
          cargo build --release --all-targets --all-features

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: check
        run: cargo check --all

      - name: clippy
        run: |
          cargo clippy --all-targets --release -- \
            -A clippy::similar_names \
            -A clippy::too_many_arguments \
            -A clippy::significant_drop_tightening \
            -A clippy::redundant_closure \
            -A clippy::missing_errors_doc \
            -A clippy::type_complexity
        shell: bash

      - name: tests
        if: matrix.os != 'windows-latest'
        run: cargo test --release --all --all-features -- --skip keyring

      - name: Windows WinFSP adapter tests
        if: matrix.os == 'windows-latest'
        run: cargo test --release --lib mount::windows::tests

      - name: bench
        if: matrix.os == 'ubuntu-latest'
        run: cargo bench --workspace --all-targets --all-features

      - name: doc
        run: cargo doc --workspace --all-features --no-deps

      - name: test package
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo aur
          cargo generate-rpm

      - name: java-bridge build
        run: |
          cd java-bridge
          cargo build --all-targets --all-features
          cargo build --release --all-targets --all-features

      - name: java-bridge fmt check
        run: |
          cd java-bridge
          cargo fmt --all -- --check

      - name: java-bridge check
        run: |
          cd java-bridge
          cargo check --all

      - name: java-bridge clippy
        run: |
          cd java-bridge
          cargo clippy --all-targets --release -- \
            -A clippy::similar_names \
            -A clippy::too_many_arguments \
            -A clippy::significant_drop_tightening \
            -A clippy::redundant_closure \
            -A clippy::missing_errors_doc \
            -A clippy::type_complexity
        shell: bash

      - name: java-bridge tests
        if: matrix.os != 'windows-latest'
        run: |
          cd java-bridge
          cargo test --release --all --all-features

      - name: bench
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd java-bridge        
          cargo bench --workspace --all-targets --all-features

      - name: java-bridge doc
        run: |
          cd java-bridge
          cargo doc --workspace --all-features --no-deps
